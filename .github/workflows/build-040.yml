name: Build 040 Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate Beacon and Gather schema
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS beacon_short_links' database/migrations/025_beacon_gather_capabilities.sql
          grep -q 'CREATE TABLE IF NOT EXISTS gather_events' database/migrations/025_beacon_gather_capabilities.sql
          grep -q 'CREATE TABLE IF NOT EXISTS gather_rsvps' database/migrations/025_beacon_gather_capabilities.sql
          grep -q 'CREATE TABLE IF NOT EXISTS gather_signup_slots' database/migrations/025_beacon_gather_capabilities.sql
      - name: Validate ownership map
        run: |
          grep -q 'Beacon must not own RSVP' docs/canonical/PLATFORM_CAPABILITY_MAP.md
          grep -q 'Gather must not own redirect infrastructure' docs/canonical/PLATFORM_CAPABILITY_MAP.md
          grep -q 'Creating a Gather event may provision' docs/canonical/PLATFORM_CAPABILITY_MAP.md
      - name: Validate routes and consent boundary
        run: |
          grep -q 'new BeaconController' public/index.php
          grep -q 'new GatherController' public/index.php
          grep -q "'/beacon'=>'Beacon'" src/Platform/UI/AppShell.php
          grep -q "'/gather'=>'Gather'" src/Platform/UI/AppShell.php
          grep -q 'consent-gated' docs/builds/BUILD_036_040_BEACON_GATHER.md
