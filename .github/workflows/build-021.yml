name: Build 021
on:
  pull_request:
  push:
    branches: [main, build/021-release-candidate-shell]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: koravik, MYSQL_USER: koravik, MYSQL_PASSWORD: koravik, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, mbstring'}
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure and migrate
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          php tools/migrate.php && php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 017_auth_recovery'
      - name: Validate unified shell hierarchy
        run: |
          php -r 'require "bootstrap.php";session_start();$_SESSION["csrf"]="test";$a=["id"=>"00000000-0000-4000-8000-000000000001","display_name"=>"Owner","role"=>"owner"];$html="<!doctype html><html><head></head><body><header class=\"app-header\"><nav aria-label=\"Primary\"></nav></header><main id=\"main\">Body</main></body></html>";$out=(new Koravik\Platform\UI\AppShell())->apply($html,$a,"/chronicle");foreach(["app-shell-header","aria-current=\"page\"","Hearth","Quests","Chronicle","Worlds","Companion","Search","Notifications","Koravik guide","Settings","Privacy","Audit activity","Security","Data controls","app-shell.css"] as $needle)if(!str_contains($out,$needle)){fwrite(STDERR,$needle);exit(1);}'
      - name: Validate visual home contract
        run: |
          grep -q 'Every capability must have one understandable visual home' docs/product/VISUAL_INFORMATION_ARCHITECTURE.md
          grep -q 'Hearth may preview but not manage full source lifecycle' docs/product/VISUAL_INFORMATION_ARCHITECTURE.md
          grep -q 'Cross-account direct-object-reference attempts fail closed' docs/engineering/RELEASE_CANDIDATE_CHECKLIST.md
          grep -q "'build'=>'021'" public/index.php
      - name: Authentication regression
        run: |
          php -r 'require "bootstrap.php";exit(Koravik\Platform\Security\Security::attempt(database()->pdo(),"owner@example.test","Koravik8")?0:1);'
