name: Build 051 Stabilization

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
      - name: Lint PHP
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate operations schema compatibility
        run: |
          test -f database/migrations/032_036_gather_operational_ui_checkin_communications.sql
          grep -q 'CREATE TABLE IF NOT EXISTS gather_announcements' database/migrations/032_036_gather_operational_ui_checkin_communications.sql
          grep -q 'ADD COLUMN rsvp_id' database/migrations/032_036_gather_operational_ui_checkin_communications.sql
          grep -q 'ADD UNIQUE KEY uq_gather_checkin_rsvp' database/migrations/032_036_gather_operational_ui_checkin_communications.sql
          grep -q 'ADD COLUMN event_id' database/migrations/032_036_gather_operational_ui_checkin_communications.sql
      - name: Validate command-center integration
        run: |
          grep -q 'checked_in_party_count' src/Districts/Gather/GatherCommandService.php
          grep -q 'gather_announcements' src/Districts/Gather/GatherCommandService.php
          grep -q 'check-in/correct' src/Districts/Gather/GatherOperationsController.php
          grep -q 'Void check-in' src/Districts/Gather/GatherOperationsController.php
          grep -q 'audience_reference' src/Districts/Gather/GatherOperationsController.php
      - name: Validate communication ownership and direct-signup delivery
        run: |
          grep -q 'account_id=:owner' src/Districts/Gather/GatherCommunicationService.php
          grep -q 'gather_signup_commitments c' src/Districts/Gather/GatherCommunicationService.php
          grep -q 'participant_email' src/Districts/Gather/GatherCommunicationService.php
          grep -q "audience==='slot'" src/Districts/Gather/GatherCommunicationService.php
      - name: Validate routing and health checkpoint
        run: |
          grep -q 'GatherOperationsController' src/Districts/Gather/GatherController.php
          grep -q "'build'=>'051'" public/index.php
