name: Build 020
on:
  pull_request:
  push:
    branches: [main, build/020-auth-recovery]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: koravik, MYSQL_USER: koravik, MYSQL_PASSWORD: koravik, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, mbstring'}
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure and migrate
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          php tools/migrate.php && php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 017_auth_recovery'
      - name: Exercise recovery and session revocation
        run: |
          php -r 'require "bootstrap.php";$s=new Koravik\Platform\Security\AuthRecoveryService(database());$s->request("owner@example.test","127.0.0.1");'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM auth_delivery_messages WHERE template_key='auth.password_reset'" | grep '^1$'
          TOKEN=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT JSON_UNQUOTE(JSON_EXTRACT(payload_json,'$.path')) FROM auth_delivery_messages ORDER BY created_at DESC LIMIT 1" | sed 's|.*/recover/reset?token=||')
          php -r 'require "bootstrap.php";(new Koravik\Platform\Security\AuthRecoveryService(database()))->reset($argv[1],"ChangedPass8");' "$TOKEN"
          php -r 'require "bootstrap.php";exit(Koravik\Platform\Security\Security::attempt(database()->pdo(),"owner@example.test","ChangedPass8")?0:1);'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT session_version FROM auth_security_state WHERE account_id='00000000-0000-4000-8000-000000000001'" | grep -E '^[2-9][0-9]*$'
      - name: Exercise lockout
        run: |
          php -r 'require "bootstrap.php";for($i=0;$i<5;$i++)Koravik\Platform\Security\Security::attempt(database()->pdo(),"owner@example.test","wrong");'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT IF(locked_until>UTC_TIMESTAMP(),1,0) FROM auth_security_state WHERE account_id='00000000-0000-4000-8000-000000000001'" | grep '^1$'
