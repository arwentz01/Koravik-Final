name: Build 019
on:
  pull_request:
  push:
    branches: [main, build/019-data-export-closure]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: koravik, MYSQL_USER: koravik, MYSQL_PASSWORD: koravik, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, mbstring'}
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          php tools/migrate.php && php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 016_data_export_account_closure'
      - name: Export and cancellable closure
        run: |
          php -r 'require "bootstrap.php";$s=new Koravik\Platform\AccountData\AccountDataService(database());$a="00000000-0000-4000-8000-000000000001";$e=$s->requestExport($a,"json");$r=$s->export($a,$e);if(!str_contains($r["manifest_json"],"password hashes"))exit(1);$c=$s->requestClosure($a,"CLOSE MY ACCOUNT");$s->cancelClosure($a,$c);'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT status FROM account_exports LIMIT 1" | grep '^completed$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT status FROM account_closures LIMIT 1" | grep '^cancelled$'
      - name: Process due closure by owner
        run: |
          php -r 'require "bootstrap.php";$s=new Koravik\Platform\AccountData\AccountDataService(database());$id=$s->requestClosure("00000000-0000-4000-8000-000000000001","CLOSE MY ACCOUNT");database()->pdo()->prepare("UPDATE account_closures SET cancellable_until=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 1 MINUTE) WHERE id=:id")->execute(["id"=>$id]);'
          php tools/process_account_closures.php 5 | grep '"processed":1'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM account_closure_steps WHERE status='completed'" | grep '^5$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT CONCAT(status,':',display_name) FROM platform_accounts WHERE id='00000000-0000-4000-8000-000000000001'" | grep '^closed:Closed account$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM auth_credentials WHERE account_id='00000000-0000-4000-8000-000000000001'" | grep '^0$'
