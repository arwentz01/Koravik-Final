name: Build 014

on:
  pull_request:
  push:
    branches: [main, build/014-companion-proposals]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 011_companion_proposals'
      - name: Exercise proposal agency boundary
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php >/tmp/server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"014"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login >/tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login >/tmp/hearth.html
          grep 'Companion' /tmp/hearth.html
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/companion >/tmp/companion.html
          grep 'Ask for help without giving up the wheel' /tmp/companion.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/companion.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'request_text=Help me make my bedroom less overwhelming' http://127.0.0.1:8080/companion/proposals >/tmp/proposal.html
          grep 'Clear one visible surface' /tmp/proposal.html
          grep 'Suggestion only' /tmp/proposal.html
          grep 'No private records were searched' /tmp/proposal.html
          PROPOSAL_ID=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT id FROM companion_proposals LIMIT 1")
          VERSION=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT version FROM companion_proposals WHERE id='$PROPOSAL_ID'")
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/proposal.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode "version=$VERSION" http://127.0.0.1:8080/companion/proposals/$PROPOSAL_ID/approve >/tmp/approved.html
          grep 'No Quest has been created yet' /tmp/approved.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT status FROM companion_proposals WHERE id='$PROPOSAL_ID'" | grep '^approved$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM quests WHERE title='Clear one visible surface'" | grep '^0$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM audit_log WHERE action='companion.proposal.approved'" | grep '^1$'
      - name: Preserve platform flows
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/settings | grep 'How should Koravik work for you'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/privacy | grep 'What may Koravik use'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/search | grep 'Find what you are looking for'
          php tools/worker.php 10 | grep '"processed": 0'