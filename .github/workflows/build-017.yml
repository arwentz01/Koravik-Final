name: Build 017
on:
  pull_request:
  push:
    branches: [main, build/017-companion-context-memory]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: koravik, MYSQL_USER: koravik, MYSQL_PASSWORD: koravik, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, mbstring'}
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          php tools/migrate.php && php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 014_companion_context_memory'
      - name: Exercise permissions and memory
        run: |
          php -r 'require "bootstrap.php"; $s=new Koravik\Platform\Companion\CompanionContextService(database());$a="00000000-0000-4000-8000-000000000001";$s->savePermissions($a,["quest.selected","companion.memory"]);$s->recordSelectedContext($a,"Quests","Quest","00000000-0000-4000-8000-000000000101","Project with one available next action.");$id=$s->remember($a,"Large tasks feel easier when broken into one visible action.","Approved in Build 017 validation.");$s->setMemoryStatus($a,$id,"disabled");'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM companion_context_permissions WHERE account_id='00000000-0000-4000-8000-000000000001' AND allowed=1" | grep '^2$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM companion_context_uses" | grep '^1$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT status FROM companion_memories LIMIT 1" | grep '^disabled$'
