name: Koravik Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Koravik
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Validate PHP syntax
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate migration inventory
        run: |
          test -d database/migrations
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
      - name: Validate Platform Mail operations
        run: |
          test -f database/migrations/037_platform_mail_operations.sql
          grep -q "recoverStale" src/Platform/Mail/MailOperationsService.php
          grep -q "/system/mail/test" src/Platform/Mail/MailOperationsController.php
      - name: Validate Gather lifecycle and Beacon domains
        run: |
          test -f database/migrations/038_042_gather_lifecycle_beacon_domains.sql
          grep -q "krvk.nl" database/migrations/038_042_gather_lifecycle_beacon_domains.sql
          grep -q "https://koravik.com/" database/migrations/038_042_gather_lifecycle_beacon_domains.sql
          grep -q "/agenda" src/Districts/Gather/GatherLifecycleController.php
          test -f tools/gather-reminder-worker.php
      - name: Validate Builds 058-062
        run: |
          test -f database/migrations/043_047_lifecycle_stabilization_beacon_management.sql
          grep -q "unsubscribe_token_hash" database/migrations/043_047_lifecycle_stabilization_beacon_management.sql
          grep -q "gather_outcome_applications" database/migrations/043_047_lifecycle_stabilization_beacon_management.sql
          grep -q "BarcodeDetector" src/Districts/Gather/GatherCompletionController.php
          grep -q "/beacon/manage" src/Districts/Beacon/BeaconManagementController.php
      - name: Validate Builds 063-067
        run: |
          test -f database/migrations/048_052_organization_foundation.sql
          grep -q "organization_memberships" database/migrations/048_052_organization_foundation.sql
          grep -q "owner_type ENUM('account','organization')" database/migrations/048_052_organization_foundation.sql
          grep -q "manage_members" src/Platform/Organizations/OrganizationService.php
          grep -q "createOrganizationEvent" src/Platform/Organizations/OrganizationService.php
          grep -q "createOrganizationLink" src/Platform/Organizations/OrganizationService.php
          grep -q "/organizations" src/Platform/Organizations/OrganizationController.php
          grep -q "GatherAuthorization" src/Districts/Gather/GatherCommandService.php
          test -f docs/builds/BUILD_063_067_ORGANIZATION_FOUNDATION.md
      - name: Validate Builds 068-077
        run: |
          test -f database/migrations/053_062_organization_operations.sql
          grep -q "organization_teams" database/migrations/053_062_organization_operations.sql
          grep -q "organization_quest_proposals" database/migrations/053_062_organization_operations.sql
          grep -q "organization_recovery_records" database/migrations/053_062_organization_operations.sql
          grep -q "GatherAuthorization" src/Districts/Gather/GatherDayOfService.php
          grep -q "GatherAuthorization" src/Districts/Gather/GatherCommunicationService.php
          grep -q "organization.invitation" src/Platform/Organizations/OrganizationService.php
          grep -q "publishPage" src/Platform/Organizations/OrganizationExpansionService.php
          grep -q "respondToQuest" src/Platform/Organizations/OrganizationExpansionService.php
          test -f docs/builds/BUILD_068_077_ORGANIZATION_OPERATIONS.md
      - name: Validate Builds 078-087
        run: |
          test -f database/migrations/063_072_household_foundation.sql
          grep -q "household_memberships" database/migrations/063_072_household_foundation.sql
          grep -q "household_quest_proposals" database/migrations/063_072_household_foundation.sql
          grep -q "household_resources" database/migrations/063_072_household_foundation.sql
          grep -q "household_recovery_records" database/migrations/063_072_household_foundation.sql
          grep -q "owner_type ENUM('account','organization','household')" database/migrations/063_072_household_foundation.sql
          grep -q "household.coordination" src/Platform/Notifications/NotificationService.php
          grep -q "respond(" src/Platform/Households/HouseholdService.php
          grep -q "/households" src/Platform/Households/HouseholdController.php
          grep -q "'build'=>'087'" public/index.php
      - name: Run repository tests
        shell: bash
        run: |
          if [ -f tools/test.php ]; then
            php tools/test.php
          else
            echo "No unified tools/test.php runner exists yet."
          fi
