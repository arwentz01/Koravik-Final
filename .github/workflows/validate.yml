name: Koravik Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Koravik
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Validate PHP syntax
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate migration inventory
        run: |
          test -d database/migrations
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
      - name: Validate Platform Mail operations
        run: |
          test -f database/migrations/037_platform_mail_operations.sql
          grep -q "recoverStale" src/Platform/Mail/MailOperationsService.php
          grep -q "/system/mail/test" src/Platform/Mail/MailOperationsController.php
      - name: Validate Gather lifecycle and Beacon domains
        run: |
          test -f database/migrations/038_042_gather_lifecycle_beacon_domains.sql
          grep -q "krvk.nl" database/migrations/038_042_gather_lifecycle_beacon_domains.sql
          grep -q "https://koravik.com/" database/migrations/038_042_gather_lifecycle_beacon_domains.sql
          grep -q "beacon_domains" src/Districts/Beacon/BeaconDomainService.php
          grep -q "root_redirect_url" src/Districts/Beacon/BeaconController.php
          grep -q "/agenda" src/Districts/Gather/GatherLifecycleController.php
          grep -q "/day-of" src/Districts/Gather/GatherLifecycleController.php
          grep -q "gather_walkins" src/Districts/Gather/GatherLifecycleService.php
          grep -q "queueDueReminders" src/Districts/Gather/GatherLifecycleService.php
          grep -q "/closeout" src/Districts/Gather/GatherCloseoutController.php
          grep -q "outcome_proposals" src/Districts/Gather/GatherLifecycleService.php
          grep -q "'build'=>'057'" public/index.php
          test -f tools/gather-reminder-worker.php
      - name: Run repository tests
        shell: bash
        run: |
          if [ -f tools/test.php ]; then
            php tools/test.php
          else
            echo "No unified tools/test.php runner exists yet."
          fi