name: Build 009

on:
  pull_request:
  push:
    branches: [main, build/009-notifications]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 008_notifications'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"009"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Notifications' /tmp/hearth.html
      - name: Preserve World catalog and structured Quests
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds | grep 'Stories that respond with permission'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create | grep 'Journey'
      - name: Create explainable World notification
        run: |
          EVENT_ID='90000000-0000-4000-8000-000000000001'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_outbox (id,event_name,event_version,account_id,payload_json,status,attempts,available_at,occurred_at,created_at) VALUES ('$EVENT_ID','Quests.QuestCompleted',1,'00000000-0000-4000-8000-000000000001',JSON_OBJECT('quest_id','00000000-0000-4000-8000-000000000101','occurrence_id','00000000-0000-4000-8000-000000000102','scheduled_date',CURRENT_DATE(),'recurring',false,'title','Notification test','quest_type','action'),'pending',0,UTC_TIMESTAMP(),UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          php tools/worker.php 20 | grep '"failed": 0'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM notifications WHERE source_event_id='$EVENT_ID' AND category='world.reactions'" | grep '^1$'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/notifications > /tmp/notifications.html
          grep 'The Caretaker noticed' /tmp/notifications.html
          grep 'Why did I receive this' /tmp/notifications.html
          grep 'permitted to interpret' /tmp/notifications.html
          grep 'notification-badge' /tmp/notifications.html
      - name: Read unread and dismiss notification
        run: |
          NOTIFICATION_ID=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT id FROM notifications WHERE source_event_id='90000000-0000-4000-8000-000000000001'")
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/notifications.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080/notifications/$NOTIFICATION_ID/read" > /tmp/read.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT read_at IS NOT NULL FROM notifications WHERE id='$NOTIFICATION_ID'" | grep '^1$'
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/read.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080/notifications/$NOTIFICATION_ID/unread" > /tmp/unread.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/unread.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080/notifications/$NOTIFICATION_ID/dismiss" > /tmp/dismissed.html
          grep 'Nothing needs your attention' /tmp/dismissed.html
      - name: Disable category and suppress future notifications
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/notifications/preferences > /tmp/preferences.html
          grep 'World reactions' /tmp/preferences.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/preferences.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'categories[]=platform.return' http://127.0.0.1:8080/notifications/preferences > /tmp/preferences-saved.html
          grep 'Notification preferences saved' /tmp/preferences-saved.html
          EVENT_ID='90000000-0000-4000-8000-000000000002'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_outbox (id,event_name,event_version,account_id,payload_json,status,attempts,available_at,occurred_at,created_at) VALUES ('$EVENT_ID','Quests.QuestCompleted',1,'00000000-0000-4000-8000-000000000001',JSON_OBJECT('quest_id','00000000-0000-4000-8000-000000000101','occurrence_id','00000000-0000-4000-8000-000000000102','scheduled_date',CURRENT_DATE(),'recurring',false,'title','Suppressed notification','quest_type','action'),'pending',0,UTC_TIMESTAMP(),UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          php tools/worker.php 20 | grep '"failed": 0'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_reactions WHERE source_event_id='$EVENT_ID'" | grep '^1$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM notifications WHERE source_event_id='$EVENT_ID'" | grep '^0$'
      - name: Preserve return experience and worker idempotency
        run: |
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "UPDATE account_activity SET last_seen_at=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 12 DAY),return_pending=0"
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies http://127.0.0.1:8080/hearth | grep 'A few things changed while you were away'
          php tools/worker.php 20 | grep '"failed": 0'
          php tools/worker.php 10 | grep '"processed": 0'
