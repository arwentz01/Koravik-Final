name: Build 006

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 005_structured_quests'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"006"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'What matters now' /tmp/hearth.html
      - name: Create a Journey with milestones
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create > /tmp/create.html
          grep 'Journey' /tmp/create.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/create.html | head -1 | sed 's/.*value="//;s/"$//')
          START=$(date +%F)
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'quest_type=journey' --data-urlencode 'title=Build a calmer morning' --data-urlencode 'description=Shape a sustainable start to the day.' --data-urlencode 'pillar_key=health' --data-urlencode 'frequency=none' --data-urlencode "starts_on=$START" --data-urlencode 'timezone=America/New_York' http://127.0.0.1:8080/quests > /tmp/journey.html
          JOURNEY_PATH=$(grep -o '/quests/[a-f0-9-]\{36\}' /tmp/journey.html | tail -1)
          test -n "$JOURNEY_PATH"
          echo "JOURNEY_PATH=$JOURNEY_PATH" >> "$GITHUB_ENV"
          grep 'Journey' /tmp/journey.html
          grep 'First foothold' /tmp/journey.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT CONCAT(quest_type, ':', COUNT(m.id)) FROM quests q JOIN quest_milestones m ON m.quest_id=q.id WHERE q.title='Build a calmer morning' GROUP BY quest_type" | grep '^journey:3$'
      - name: Add steps and block premature completion
        run: |
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$JOURNEY_PATH" > /tmp/journey.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/journey.html | head -1 | sed 's/.*value="//;s/"$//')
          for STEP in 'Prepare clothes the night before' 'Drink water after waking' 'Take five quiet minutes'; do
            curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode "step_title=$STEP" --data-urlencode 'required=1' "http://127.0.0.1:8080$JOURNEY_PATH/steps" > /tmp/step.html
            CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/step.html | head -1 | sed 's/.*value="//;s/"$//')
          done
          grep '0%' /tmp/step.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/step.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$JOURNEY_PATH/complete" > /tmp/blocked.html
          grep 'Complete the required steps' /tmp/blocked.html
      - name: Complete steps reach milestones and finish Journey
        run: |
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$JOURNEY_PATH" > /tmp/steps.html
          mapfile -t STEP_PATHS < <(grep -o "$JOURNEY_PATH/steps/[a-f0-9-]\{36\}/complete" /tmp/steps.html)
          test "${#STEP_PATHS[@]}" = '3'
          for STEP_PATH in "${STEP_PATHS[@]}"; do
            curl -sS -b /tmp/cookies "http://127.0.0.1:8080$JOURNEY_PATH" > /tmp/current.html
            CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/current.html | head -1 | sed 's/.*value="//;s/"$//')
            curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$STEP_PATH" > /tmp/progress.html
          done
          grep '100%' /tmp/progress.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM quest_milestones m JOIN quests q ON q.id=m.quest_id WHERE q.title='Build a calmer morning' AND m.reached_at IS NOT NULL" | grep '^3$'
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/progress.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$JOURNEY_PATH/complete" > /tmp/completed.html
          grep 'Quest completed' /tmp/completed.html
          grep 'The Caretaker remembered' /tmp/completed.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT JSON_UNQUOTE(JSON_EXTRACT(payload_json, '$.quest_type')) FROM platform_outbox WHERE event_name='Quests.QuestCompleted' ORDER BY created_at DESC LIMIT 1" | grep '^journey$'
          php tools/worker.php 10 | grep '"processed": 0'
