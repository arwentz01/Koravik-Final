name: Build 003

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 002_quest_lifecycle_recurrence'
      - name: Start application
        run: php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
      - name: Sign in
        run: |
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"003"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies \
            --data-urlencode "csrf=$CSRF" \
            --data-urlencode 'email=owner@example.test' \
            --data-urlencode 'password=Koravik8' \
            http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'New Quest' /tmp/hearth.html
      - name: Verify Monday Wednesday Friday recurrence
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create > /tmp/create.html
          grep 'weekdays\[\]' /tmp/create.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/create.html | head -1 | sed 's/.*value="//;s/"$//')
          START=$(date +%F)
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies \
            --data-urlencode "csrf=$CSRF" \
            --data-urlencode 'title=Move with intention' \
            --data-urlencode 'description=A recurring life action, not a checklist streak.' \
            --data-urlencode 'frequency=weekly' \
            --data-urlencode 'interval_count=1' \
            --data-urlencode "starts_on=$START" \
            --data-urlencode 'weekdays[]=1' \
            --data-urlencode 'weekdays[]=3' \
            --data-urlencode 'weekdays[]=5' \
            --data-urlencode 'timezone=America/New_York' \
            http://127.0.0.1:8080/quests > /tmp/created.html
          grep 'Every week on Mon, Wed, Fri' /tmp/created.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT GROUP_CONCAT(weekday ORDER BY weekday) FROM quest_recurrence_weekdays w JOIN quests q ON q.id=w.quest_id WHERE q.title='Move with intention'" | grep '^1,3,5$'
          COUNT=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM quest_occurrences o JOIN quests q ON q.id=o.quest_id WHERE q.title='Move with intention'")
          test "$COUNT" -ge 35
      - name: Verify biweekly Monday and occurrence completion
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create > /tmp/create-biweekly.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/create-biweekly.html | head -1 | sed 's/.*value="//;s/"$//')
          START=$(date +%F)
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies \
            --data-urlencode "csrf=$CSRF" \
            --data-urlencode 'title=Call someone I care about' \
            --data-urlencode 'frequency=weekly' \
            --data-urlencode 'interval_count=2' \
            --data-urlencode "starts_on=$START" \
            --data-urlencode 'weekdays[]=1' \
            --data-urlencode 'timezone=America/New_York' \
            http://127.0.0.1:8080/quests > /tmp/biweekly.html
          grep 'Every 2 weeks on Mon' /tmp/biweekly.html
          CREATED_PATH=$(grep -o '/quests/[a-f0-9-]\{36\}' /tmp/biweekly.html | tail -1)
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$CREATED_PATH" > /tmp/quest.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/quest.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$CREATED_PATH/complete" > /tmp/completed.html
          grep 'Occurrence complete' /tmp/completed.html
          php tools/worker.php 10 | grep '"processed": 0'
      - name: Verify lifecycle and bounded generation
        run: |
          php tools/generate-occurrences.php 120 50 | grep '"days_ahead": 120'
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests > /tmp/quests.html
          PATH_TO_PAUSE=$(grep -o '/quests/[a-f0-9-]\{36\}' /tmp/quests.html | head -1)
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$PATH_TO_PAUSE" > /tmp/pause.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/pause.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$PATH_TO_PAUSE/pause" > /tmp/paused.html
          grep 'Quest paused' /tmp/paused.html
