name: Build 010

on:
  pull_request:
  push:
    branches: [main, build/010-global-search]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 008_notifications'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"010"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Search' /tmp/hearth.html
          grep 'Notifications' /tmp/hearth.html
      - name: Verify initial guidance and empty results
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/search > /tmp/search.html
          grep 'Find what you are looking for' /tmp/search.html
          grep 'checks authorization before showing each result' /tmp/search.html
          curl --fail -sS -G -b /tmp/cookies --data-urlencode 'q=definitely absent phrase' http://127.0.0.1:8080/search > /tmp/no-results.html
          grep 'No results for' /tmp/no-results.html
      - name: Search grouped owned records
        run: |
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO chronicle_entries (id,account_id,entry_type,title,body,status,created_at) VALUES ('a0000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000001','reflection','A calmer corner','I made the reading corner easier to return to.','active',UTC_TIMESTAMP())"
          curl --fail -sS -G -b /tmp/cookies --data-urlencode 'q=corner' http://127.0.0.1:8080/search > /tmp/corner.html
          grep '<h2>Quests</h2>' /tmp/corner.html
          grep 'Make one corner calmer' /tmp/corner.html
          grep '<h2>Chronicle</h2>' /tmp/corner.html
          grep 'A calmer corner' /tmp/corner.html
          grep 'Results stay grouped by the part of Koravik that owns them' /tmp/corner.html
          curl --fail -sS -G -b /tmp/cookies --data-urlencode 'q=Epic Ordinary' http://127.0.0.1:8080/search > /tmp/world-search.html
          grep '<h2>Worlds</h2>' /tmp/world-search.html
          grep 'Review World' /tmp/world-search.html
      - name: Enforce account authorization and literal wildcards
        run: |
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_accounts (id,email,display_name,role,status,created_at,updated_at) VALUES ('b0000000-0000-4000-8000-000000000001','other@example.test','Other','user','active',UTC_TIMESTAMP(),UTC_TIMESTAMP()); INSERT INTO quests (id,account_id,title,description,quest_type,status,lifecycle_status,created_at,updated_at) VALUES ('b0000000-0000-4000-8000-000000000101','b0000000-0000-4000-8000-000000000001','Private lighthouse plan','Should never appear for Builder','action','active','active',UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          curl --fail -sS -G -b /tmp/cookies --data-urlencode 'q=lighthouse' http://127.0.0.1:8080/search > /tmp/private.html
          grep 'No results for' /tmp/private.html
          ! grep 'Private lighthouse plan' /tmp/private.html
          curl --fail -sS -G -b /tmp/cookies --data-urlencode 'q=%' http://127.0.0.1:8080/search > /tmp/literal.html
          grep 'No results for' /tmp/literal.html
      - name: Preserve previous platform flows
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds | grep 'Stories that respond with permission'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create | grep 'Journey'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/notifications | grep 'What changed that deserves your attention'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "UPDATE account_activity SET last_seen_at=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 12 DAY),return_pending=0"
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies http://127.0.0.1:8080/hearth | grep 'A few things changed while you were away'
          php tools/worker.php 20 | grep '"failed": 0'
          php tools/worker.php 10 | grep '"processed": 0'
