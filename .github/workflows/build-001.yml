name: Build 005

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 004_epic_ordinary_continuation'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT current_chapter FROM world_narrative_progress" | grep '^the-first-light$'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"005"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Enter Epic Ordinary' /tmp/hearth.html
          grep '>World<' /tmp/hearth.html
      - name: Verify meaningful World choice
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/world/epic-ordinary > /tmp/world.html
          grep 'The Caretaker was already awake' /tmp/world.html
          grep 'Remind me gently' /tmp/world.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/world.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'choice=gentle' http://127.0.0.1:8080/world/epic-ordinary/choice > /tmp/chosen.html
          grep 'The Caretaker will remember that choice' /tmp/chosen.html
          grep 'Remind me gently' /tmp/chosen.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT CONCAT(choice_key, ':', trust_score, ':', relationship_stage) FROM world_choice_history c JOIN world_relationships r ON r.installation_id=c.installation_id WHERE c.scene_key='caretaker-welcome'" | grep '^gentle:2:known$'
      - name: Verify real-life action changes relationship
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/00000000-0000-4000-8000-000000000101 > /tmp/quest.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/quest.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/quests/00000000-0000-4000-8000-000000000101/complete > /tmp/completed.html
          grep 'The Caretaker remembered' /tmp/completed.html
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/world/epic-ordinary > /tmp/world-after.html
          grep 'Make one corner calmer' /tmp/world-after.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT trust_score FROM world_relationships WHERE npc_key='caretaker'" | grep '^3$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_relationship_history WHERE reason_code='quest.completed'" | grep '^1$'
          php tools/worker.php 10 | grep '"processed": 0'
