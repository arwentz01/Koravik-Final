name: Build 008

on:
  pull_request:
  push:
    branches: [main, build/008-return-resume-triage]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 007_return_resume_triage'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"008"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'What matters now' /tmp/hearth.html
      - name: Preserve Build 007 World catalog
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds > /tmp/worlds.html
          grep 'Stories that respond with permission' /tmp/worlds.html
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds/epic-ordinary | grep 'Quest occurrence completed'
      - name: Simulate extended absence and stale occurrences
        run: |
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "UPDATE account_activity SET last_seen_at=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 12 DAY),return_pending=0"
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "UPDATE quest_occurrences SET scheduled_for=DATE_SUB(CURRENT_DATE(),INTERVAL 10 DAY),status='available' WHERE id='00000000-0000-4000-8000-000000000102'"
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies http://127.0.0.1:8080/hearth > /tmp/return.html
          grep 'A few things changed while you were away' /tmp/return.html
          grep 'Does this still matter' /tmp/return.html
          grep 'Nothing here is a failure' /tmp/return.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM platform_outbox WHERE event_name='Platform.PlayerReturned'" | grep '^1$'
      - name: Skip stale occurrence without changing recurrence
        run: |
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/return.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/return/occurrences/00000000-0000-4000-8000-000000000102/skip > /tmp/after-skip.html
          grep 'That intention has been updated' /tmp/after-skip.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT status FROM quest_occurrences WHERE id='00000000-0000-4000-8000-000000000102'" | grep '^skipped$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM quest_recurrence_rules" | grep -E '^[0-9]+$'
      - name: Process return reaction and continue
        run: |
          php tools/worker.php 20 | grep '"failed": 0'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_reactions WHERE title='The light was left on'" | grep '^1$'
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/after-skip.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/return/continue > /tmp/hearth-returned.html
          grep 'What matters now' /tmp/hearth-returned.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT return_pending FROM account_activity" | grep '^0$'
      - name: Preserve structured Quest regression
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create | grep 'Journey'
          php tools/worker.php 10 | grep '"processed": 0'
