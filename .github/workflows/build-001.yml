name: Build 007

on:
  pull_request:
  push:
    branches: [main, build/007-world-catalog-permissions]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 006_world_catalog_permissions'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"006"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Worlds' /tmp/hearth.html
      - name: Verify World catalog and informed detail
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds > /tmp/worlds.html
          grep 'Stories that respond with permission' /tmp/worlds.html
          grep 'Epic Ordinary' /tmp/worlds.html
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds/epic-ordinary > /tmp/world.html
          grep 'Content notice' /tmp/world.html
          grep 'Accessibility' /tmp/world.html
          grep 'Quest occurrence completed' /tmp/world.html
          grep 'Granted' /tmp/world.html
      - name: Revoke permission and suppress World reaction
        run: |
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/world.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/worlds/epic-ordinary/permissions/quest-completed/revoke > /tmp/revoked.html
          grep 'Quest completion access revoked' /tmp/revoked.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT granted FROM world_fact_permissions p JOIN world_installations i ON i.id=p.installation_id WHERE i.world_key='epic-ordinary' AND p.fact_key='quest.completed'" | grep '^0$'
          BEFORE=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_reactions")
          EVENT_ID='70000000-0000-4000-8000-000000000001'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_outbox (id,event_name,event_version,account_id,payload_json,status,attempts,available_at,occurred_at,created_at) VALUES ('$EVENT_ID','Quests.QuestCompleted',1,'00000000-0000-4000-8000-000000000001',JSON_OBJECT('quest_id','00000000-0000-4000-8000-000000000101','title','Permission test'),'pending',0,UTC_TIMESTAMP(),UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          php tools/worker.php 10
          AFTER=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_reactions")
          test "$BEFORE" = "$AFTER"
      - name: Grant permission and resume reactions
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/worlds/epic-ordinary > /tmp/world-revoked.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/world-revoked.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/worlds/epic-ordinary/permissions/quest-completed/grant > /tmp/granted.html
          grep 'Quest completion access granted' /tmp/granted.html
          EVENT_ID='70000000-0000-4000-8000-000000000002'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_outbox (id,event_name,event_version,account_id,payload_json,status,attempts,available_at,occurred_at,created_at) VALUES ('$EVENT_ID','Quests.QuestCompleted',1,'00000000-0000-4000-8000-000000000001',JSON_OBJECT('quest_id','00000000-0000-4000-8000-000000000101','title','Permission restored'),'pending',0,UTC_TIMESTAMP(),UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          php tools/worker.php 10
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_reactions WHERE source_event_id='$EVENT_ID'" | grep '^1$'
      - name: Verify suspend resume and retained state
        run: |
          STATE_BEFORE=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_state")
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/worlds/epic-ordinary > /tmp/world-active.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/world-active.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/worlds/epic-ordinary/suspend > /tmp/suspended.html
          grep 'World suspended' /tmp/suspended.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT status FROM world_installations WHERE world_key='epic-ordinary'" | grep '^suspended$'
          STATE_AFTER=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_state")
          test "$STATE_BEFORE" = "$STATE_AFTER"
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/suspended.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/worlds/epic-ordinary/resume > /tmp/resumed.html
          grep 'World resumed' /tmp/resumed.html
      - name: Preserve structured Quest regression
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create > /tmp/create.html
          grep 'Journey' /tmp/create.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM quest_milestones" | grep -E '^[0-9]+$'
          php tools/worker.php 10 | grep '"processed": 0'
