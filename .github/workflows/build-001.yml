name: Build 012

on:
  pull_request:
  push:
    branches: [main, build/012-account-settings]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 009_account_settings'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"012"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Settings' /tmp/hearth.html
      - name: Save account and accessibility settings
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/settings > /tmp/settings.html
          grep 'How should Koravik work for you' /tmp/settings.html
          grep 'Notification preferences' /tmp/settings.html
          grep 'Account export and deletion execution are not yet available' /tmp/settings.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/settings.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'display_name=Builder Updated' --data-urlencode 'appearance=dark' --data-urlencode 'reduced_motion=on' --data-urlencode 'high_contrast=on' --data-urlencode 'timezone=America/Chicago' --data-urlencode 'date_format=year_month_day' http://127.0.0.1:8080/settings > /tmp/saved.html
          grep 'Settings saved' /tmp/saved.html
          grep 'Builder Updated' /tmp/saved.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT CONCAT(appearance,':',reduced_motion,':',high_contrast,':',timezone,':',date_format) FROM account_settings WHERE account_id='00000000-0000-4000-8000-000000000001'" | grep '^dark:1:1:America/Chicago:year_month_day$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM audit_log WHERE account_id='00000000-0000-4000-8000-000000000001' AND action='settings.updated'" | grep '^1$'
      - name: Reject invalid settings and preserve prior flows
        run: |
          php -r 'require "bootstrap.php"; try {(new \Koravik\Platform\Settings\SettingsService(database()))->save("00000000-0000-4000-8000-000000000001",["display_name"=>"Builder","appearance"=>"neon","timezone"=>"UTC","date_format"=>"month_day_year"]); exit(1);} catch (RuntimeException $e) {echo $e->getMessage();}' | grep 'valid appearance'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/privacy | grep 'What may Koravik use'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/search | grep 'Find what you are looking for'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/notifications | grep 'What changed that deserves attention'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds | grep 'Stories that respond with permission'
          php tools/worker.php 10 | grep '"processed": 0'