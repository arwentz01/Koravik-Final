name: Build 013

on:
  pull_request:
  push:
    branches: [main, build/013-hearth-customization]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 010_hearth_layout'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"013"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Customize Hearth' /tmp/hearth.html
          grep 'What matters now' /tmp/hearth.html
      - name: Customize bounded optional sections
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/hearth/customize > /tmp/customize.html
          grep 'What should appear on your Hearth' /tmp/customize.html
          grep 'The greeting and “What matters now” remain required' /tmp/customize.html
          grep 'Restore defaults' /tmp/customize.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/customize.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'order[]=world' --data-urlencode 'order[]=chronicle' --data-urlencode 'order[]=pillars' --data-urlencode 'visible[]=world' --data-urlencode 'visible[]=pillars' http://127.0.0.1:8080/hearth/customize > /tmp/saved.html
          grep 'Hearth layout saved' /tmp/saved.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT GROUP_CONCAT(CONCAT(widget_key,':',position,':',visible) ORDER BY position SEPARATOR ',') FROM hearth_layout_preferences WHERE account_id='00000000-0000-4000-8000-000000000001'" | grep '^world:10:1,chronicle:20:0,pillars:30:1$'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/hearth > /tmp/custom-hearth.html
          grep 'What matters now' /tmp/custom-hearth.html
          grep 'Continue with the Caretaker' /tmp/custom-hearth.html
          ! grep 'Your story will gather here' /tmp/custom-hearth.html
      - name: Restore defaults and preserve platform flows
        run: |
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/saved.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" http://127.0.0.1:8080/hearth/customize/reset > /tmp/reset.html
          grep 'Hearth layout restored to defaults' /tmp/reset.html
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/hearth | grep 'Your story will gather here'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/settings | grep 'How should Koravik work for you'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/privacy | grep 'What may Koravik use'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/search | grep 'Find what you are looking for'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/notifications | grep 'What changed that deserves attention'
          php tools/worker.php 10 | grep '"processed": 0'