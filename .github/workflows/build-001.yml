name: Build 005

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 004_epic_ordinary_progression'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"005"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Enter the World' /tmp/hearth.html
      - name: Complete a Quest and unlock a scene
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create > /tmp/create.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/create.html | head -1 | sed 's/.*value="//;s/"$//')
          START=$(date +%F)
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'title=Make the room kinder' --data-urlencode 'pillar_key=home' --data-urlencode 'frequency=none' --data-urlencode "starts_on=$START" --data-urlencode 'timezone=America/New_York' http://127.0.0.1:8080/quests > /tmp/created.html
          QUEST_PATH=$(grep -o '/quests/[a-f0-9-]\{36\}' /tmp/created.html | tail -1)
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$QUEST_PATH" > /tmp/quest.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/quest.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$QUEST_PATH/complete" > /tmp/completed.html
          grep 'A new scene is waiting' /tmp/completed.html
          COMPLETION_PATH=$(grep -o '/completions/[a-f0-9-]\{36\}' /tmp/completed.html | head -1)
          echo "COMPLETION_PATH=$COMPLETION_PATH" >> "$GITHUB_ENV"
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/world > /tmp/world.html
          grep 'A lantern wakes along the path' /tmp/world.html
          grep 'Offer to help restore the path' /tmp/world.html
          SCENE_PATH=$(grep -o '/world/scenes/[a-f0-9-]\{36\}/choose' /tmp/world.html | head -1)
          echo "SCENE_PATH=$SCENE_PATH" >> "$GITHUB_ENV"
      - name: Choose and persist World consequence
        run: |
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/world.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'choice_key=restore' "http://127.0.0.1:8080$SCENE_PATH" > /tmp/chosen.html
          grep 'Together, you make the next stretch safer' /tmp/chosen.html
          grep 'Familiar presence' /tmp/chosen.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT SUM(relationship_delta) FROM world_relationship_entries WHERE status='active'" | grep '^2$'
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/chronicle | grep 'A choice in Epic Ordinary'
      - name: Reverse World consequence with source completion
        run: |
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$COMPLETION_PATH" > /tmp/completion.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/completion.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$COMPLETION_PATH/undo" > /tmp/undone.html
          grep 'Completion undone' /tmp/undone.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_scenes WHERE status='reversed'" | grep '^1$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_relationship_entries WHERE status='reversed'" | grep '^1$'
          php tools/worker.php 10 | grep '"processed": 0'
