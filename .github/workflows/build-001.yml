name: Build 011

on:
  pull_request:
  push:
    branches: [main, build/011-privacy-consent-audit]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 008_notifications'
      - name: Start application and sign in
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"011"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" --data-urlencode 'email=owner@example.test' --data-urlencode 'password=Koravik8' http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'Privacy' /tmp/hearth.html
      - name: Explain current grants and last use
        run: |
          EVENT_ID='91000000-0000-4000-8000-000000000001'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_outbox (id,event_name,event_version,account_id,payload_json,status,attempts,available_at,occurred_at,created_at) VALUES ('$EVENT_ID','Quests.QuestCompleted',1,'00000000-0000-4000-8000-000000000001',JSON_OBJECT('quest_id','00000000-0000-4000-8000-000000000101','occurrence_id','00000000-0000-4000-8000-000000000102','scheduled_date',CURRENT_DATE(),'recurring',false,'title','Privacy test','quest_type','action'),'pending',0,UTC_TIMESTAMP(),UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          php tools/worker.php 20 | grep '"failed": 0'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/privacy > /tmp/privacy.html
          grep 'What may Koravik use' /tmp/privacy.html
          grep 'Quest occurrence completed' /tmp/privacy.html
          grep 'Player returned after an absence' /tmp/privacy.html
          grep 'Last used' /tmp/privacy.html
          grep 'Revocation effect' /tmp/privacy.html
      - name: Revoke and enforce future delivery
        run: |
          INSTALLATION_ID=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT id FROM world_installations WHERE account_id='00000000-0000-4000-8000-000000000001' AND world_key='epic-ordinary'")
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/privacy.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080/privacy/$INSTALLATION_ID/quest.completed/revoke" > /tmp/revoked.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT granted FROM world_fact_permissions WHERE installation_id='$INSTALLATION_ID' AND fact_key='quest.completed'" | grep '^0$'
          grep 'Grant permission' /tmp/revoked.html
          EVENT_ID='91000000-0000-4000-8000-000000000002'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -e "INSERT INTO platform_outbox (id,event_name,event_version,account_id,payload_json,status,attempts,available_at,occurred_at,created_at) VALUES ('$EVENT_ID','Quests.QuestCompleted',1,'00000000-0000-4000-8000-000000000001',JSON_OBJECT('quest_id','00000000-0000-4000-8000-000000000101','occurrence_id','00000000-0000-4000-8000-000000000102','scheduled_date',CURRENT_DATE(),'recurring',false,'title','Revoked test','quest_type','action'),'pending',0,UTC_TIMESTAMP(),UTC_TIMESTAMP(),UTC_TIMESTAMP())"
          php tools/worker.php 20 | grep '"failed": 0'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM world_reactions WHERE source_event_id='$EVENT_ID'" | grep '^0$'
      - name: Restore grant and verify audit trail
        run: |
          INSTALLATION_ID=$(mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT id FROM world_installations WHERE account_id='00000000-0000-4000-8000-000000000001' AND world_key='epic-ordinary'")
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/revoked.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080/privacy/$INSTALLATION_ID/quest.completed/grant" > /tmp/granted.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT granted FROM world_fact_permissions WHERE installation_id='$INSTALLATION_ID' AND fact_key='quest.completed'" | grep '^1$'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/audit > /tmp/audit.html
          grep 'What consequential actions occurred' /tmp/audit.html
          grep 'Permission was revoked for future fact delivery' /tmp/audit.html
          grep 'Permission was granted for future fact delivery' /tmp/audit.html
          grep 'This historical record cannot be edited' /tmp/audit.html
      - name: Preserve previous platform flows
        run: |
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/search | grep 'Find what you are looking for'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/notifications | grep 'What changed that deserves attention'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/worlds | grep 'Stories that respond with permission'
          curl --fail -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create | grep 'Journey'
          php tools/worker.php 10 | grep '"processed": 0'
