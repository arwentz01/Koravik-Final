name: Build 004

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: koravik
          MYSQL_USER: koravik
          MYSQL_PASSWORD: koravik
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          echo 'SEED_DISPLAY_NAME=Builder' >> .env
      - name: Migrate and seed
        run: |
          php tools/migrate.php
          php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 003_pillars_chronicle'
      - name: Start application
        run: php -S 127.0.0.1:8080 -t public public/index.php > /tmp/koravik-server.log 2>&1 &
      - name: Sign in
        run: |
          sleep 2
          curl --fail http://127.0.0.1:8080/health | grep '"build":"004"'
          curl -sS -c /tmp/cookies http://127.0.0.1:8080/login > /tmp/login.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies \
            --data-urlencode "csrf=$CSRF" \
            --data-urlencode 'email=owner@example.test' \
            --data-urlencode 'password=Koravik8' \
            http://127.0.0.1:8080/login > /tmp/hearth.html
          grep 'What matters now' /tmp/hearth.html
      - name: Verify Pillar completion experience
        run: |
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/quests/create > /tmp/create.html
          grep 'Supports' /tmp/create.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/create.html | head -1 | sed 's/.*value="//;s/"$//')
          START=$(date +%F)
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies \
            --data-urlencode "csrf=$CSRF" \
            --data-urlencode 'title=Prepare a nourishing meal' \
            --data-urlencode 'description=Choose something simple and sustaining.' \
            --data-urlencode 'pillar_key=health' \
            --data-urlencode 'frequency=none' \
            --data-urlencode "starts_on=$START" \
            --data-urlencode 'timezone=America/New_York' \
            http://127.0.0.1:8080/quests > /tmp/created.html
          CREATED_PATH=$(grep -o '/quests/[a-f0-9-]\{36\}' /tmp/created.html | tail -1)
          test -n "$CREATED_PATH"
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$CREATED_PATH" > /tmp/quest.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/quest.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$CREATED_PATH/complete" > /tmp/completed.html
          grep 'Quest completed' /tmp/completed.html
          grep 'Health' /tmp/completed.html
          grep 'Moment recorded' /tmp/completed.html
          COMPLETION_PATH=$(grep -o '/completions/[a-f0-9-]\{36\}' /tmp/completed.html | head -1)
          test -n "$COMPLETION_PATH"
          echo "COMPLETION_PATH=$COMPLETION_PATH" >> "$GITHUB_ENV"
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM pillar_contributions WHERE pillar_key='health' AND status='active'" | grep '^1$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM chronicle_entries WHERE entry_type='system' AND status='active'" | grep '^1$'
      - name: Verify reflection and Hearth composition
        run: |
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/completed.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies \
            --data-urlencode "csrf=$CSRF" \
            --data-urlencode 'reflection=This made the evening feel steadier.' \
            "http://127.0.0.1:8080$COMPLETION_PATH/reflection" > /tmp/reflected.html
          grep 'Reflection saved' /tmp/reflected.html
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/chronicle > /tmp/chronicle.html
          grep 'This made the evening feel steadier' /tmp/chronicle.html
          curl -sS -b /tmp/cookies http://127.0.0.1:8080/hearth > /tmp/hearth-after.html
          grep 'What you have been supporting' /tmp/hearth-after.html
          grep 'Health' /tmp/hearth-after.html
      - name: Verify reversal and idempotency
        run: |
          curl -sS -b /tmp/cookies "http://127.0.0.1:8080$COMPLETION_PATH" > /tmp/completion-again.html
          CSRF=$(grep -o 'name="csrf" value="[^"]*"' /tmp/completion-again.html | head -1 | sed 's/.*value="//;s/"$//')
          curl --fail -sS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "csrf=$CSRF" "http://127.0.0.1:8080$COMPLETION_PATH/undo" > /tmp/undone.html
          grep 'Completion undone' /tmp/undone.html
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM pillar_contributions WHERE status='reversed'" | grep '^1$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM chronicle_entries WHERE entry_type='system' AND status='reversed'" | grep '^1$'
          php tools/worker.php 10 | grep '"processed": 0'
