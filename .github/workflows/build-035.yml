name: Build 035 Journey Arc

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate journey contracts
        run: |
          grep -q "'build'=>'035'" public/index.php
          grep -q 'story_invitations' database/migrations/024_journey_arc_invitations_rooms_conversations.sql
          grep -q 'relationship_conversations' database/migrations/024_journey_arc_invitations_rooms_conversations.sql
          grep -q 'quest_source_proposals' database/migrations/024_journey_arc_invitations_rooms_conversations.sql
          grep -q 'cooperative_quest_invitations' database/migrations/024_journey_arc_invitations_rooms_conversations.sql
          grep -q "origin_type'=>'story'" src/Platform/Journey/JourneyArcService.php
          grep -q "\['accept','decline','snooze'\]" src/Platform/Journey/JourneyArcService.php
          grep -q "\['beacon','gather'\]" src/Platform/Journey/JourneyArcService.php
      - name: Guard agency boundaries
        run: |
          ! grep -RniE 'affection points|relationship penalty|punish.*declin|auto.*create.*quest' src docs/builds/BUILD_031_035_JOURNEY_ARC.md
