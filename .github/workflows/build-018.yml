name: Build 018
on:
  pull_request:
  push:
    branches: [main, build/018-chronicle-ownership]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: koravik, MYSQL_USER: koravik, MYSQL_PASSWORD: koravik, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, mbstring'}
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          php tools/migrate.php && php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 015_chronicle_ownership'
      - name: Exercise Chronicle ownership
        run: |
          php -r 'require "bootstrap.php";$s=new Koravik\Platform\Experience\ChronicleManagementService(database());$a="00000000-0000-4000-8000-000000000001";$id=$s->create($a,["title"=>"A quiet win","body"=>"I made the room easier to return to.","tags"=>"home,reflection"]);$s->update($a,$id,["title"=>"A quiet win","body"=>"I made one corner easier to return to.","tags"=>"home"]);$s->lifecycle($a,$id,"archive");$s->lifecycle($a,$id,"restore");database()->pdo()->exec("INSERT INTO chronicle_entries (id,account_id,entry_type,title,body,provenance_type,provenance_label,editable,status,created_at,updated_at) VALUES (\"18000000-0000-4000-8000-000000000001\",\"00000000-0000-4000-8000-000000000001\",\"system\",\"Generated moment\",\"Historical fact\",\"quest_event\",\"Quest completion moment\",0,\"active\",UTC_TIMESTAMP(),UTC_TIMESTAMP())");'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT CONCAT(entry_type,':',provenance_type,':',editable,':',status) FROM chronicle_entries WHERE title='A quiet win'" | grep '^personal:player_authored:1:active$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM chronicle_tags WHERE tag_name='home'" | grep '^1$'
          php -r 'require "bootstrap.php";try{(new Koravik\Platform\Experience\ChronicleManagementService(database()))->lifecycle("00000000-0000-4000-8000-000000000001","18000000-0000-4000-8000-000000000001","delete");exit(1);}catch(RuntimeException $e){echo "protected";}' | grep 'protected'
