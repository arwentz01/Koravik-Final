name: Build 041

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP
        run: find src public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate Gather guest registration boundary
        run: |
          test -f database/migrations/026_gather_guest_registration_capacity.sql
          grep -q "management_token_hash" database/migrations/026_gather_guest_registration_capacity.sql
          grep -q "additional_guests_enabled" database/migrations/026_gather_guest_registration_capacity.sql
          grep -q "waitlist_position" database/migrations/026_gather_guest_registration_capacity.sql
          grep -q "multiple_signups_allowed" database/migrations/026_gather_guest_registration_capacity.sql
          grep -q "hash('sha256'" src/Districts/Gather/GatherService.php
          grep -q "visibility IN (\"unlisted\",\"public\")" src/Districts/Gather/GatherService.php
          grep -q "/gather/rsvp/manage/" src/Districts/Gather/GatherController.php
          grep -q "queued for delivery" src/Districts/Gather/GatherController.php
          grep -q "Actual SMTP/provider delivery remains deferred" docs/IMPLEMENTATION_HANDOFF.md
      - name: Validate health checkpoint
        run: grep -q "'build'=>'041'" public/index.php
