name: Build 016
on:
  pull_request:
  push:
    branches: [main, build/016-companion-lifecycle]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: koravik, MYSQL_USER: koravik, MYSQL_PASSWORD: koravik, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'pdo_mysql, mbstring'}
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: |
          cp .env.example .env
          sed -i 's|DB_DSN=.*|DB_DSN=mysql:host=127.0.0.1;port=3306;dbname=koravik;charset=utf8mb4|' .env
          sed -i 's|DB_PASS=.*|DB_PASS=koravik|' .env
          echo 'SEED_EMAIL=owner@example.test' >> .env
          echo 'SEED_PASSWORD=Koravik8' >> .env
          php tools/migrate.php && php tools/seed.php
          php tools/migrate.php | grep 'Already applied: 013_companion_lifecycle'
      - name: Exercise lifecycle
        run: |
          php -r 'require "bootstrap.php"; $pdo=database()->pdo(); $id="16000000-0000-4000-8000-000000000001"; $pdo->prepare("INSERT INTO companion_proposals (id,account_id,proposal_type,status,version,request_text,title,proposed_payload_json,reasoning,source_context,owning_module,consequence,expires_at,created_at,updated_at) VALUES (?,\"00000000-0000-4000-8000-000000000001\",\"quest.create\",\"approved\",1,\"test request\",\"Test\",JSON_OBJECT(\"title\",\"Test\",\"notes\",\"\",\"quest_type\",\"action\"),\"reason\",\"context\",\"Quests\",\"one quest\",DATE_SUB(UTC_TIMESTAMP(),INTERVAL 1 DAY),UTC_TIMESTAMP(),UTC_TIMESTAMP())")->execute([$id]); $s=new Koravik\Platform\Companion\CompanionLifecycleService(database()); if($s->expireDue("00000000-0000-4000-8000-000000000001")!==1) exit(1); $s->renew("00000000-0000-4000-8000-000000000001",$id); $s->clarify("00000000-0000-4000-8000-000000000001",$id,"What changes?");'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT CONCAT(status,':',version,':',clarification_text IS NOT NULL) FROM companion_proposals WHERE id='16000000-0000-4000-8000-000000000001'" | grep '^awaiting_approval:2:1$'
          mysql -h127.0.0.1 -ukoravik -pkoravik koravik -N -e "SELECT COUNT(*) FROM platform_outbox WHERE event_name IN ('Companion.ProposalRevised','Companion.ProposalClarified')" | grep '^2$'
